name: Build Linux packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libgtk-4-dev dpkg-dev rpm
      - name: Build and package
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --parallel 2
          cpack --config build/CPackConfig.cmake -G DEB -B build
          cpack --config build/CPackConfig.cmake -G RPM -B build
          cpack --config build/CPackConfig.cmake -G TGZ -B build
      - uses: actions/upload-artifact@v4
        with:
          name: nebula-control-center-linux-packages
          path: build/nebula-control-center-2.1.0-Linux.*
          if-no-files-found: error
          retention-days: 30
